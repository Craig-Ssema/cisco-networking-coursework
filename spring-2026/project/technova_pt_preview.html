<!DOCTYPE html>

<meta charset="UTF-8">
<title>TechNova — Packet Tracer Logical Workspace preview</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background:#3A3F47;
    padding:14px;
    min-height:100vh;
  }
  .frame{
    max-width:1680px;margin:0 auto;
    background:#FFFFFF;
    border:1px solid #1A1C22;
    border-radius:3px;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);
  }
  /* PT titlebar */
  .titlebar{
    background:linear-gradient(#5A6370,#3B4350);
    color:#fff;font-size:12px;padding:5px 10px;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid #000;
  }
  .titlebar .dots{display:flex;gap:5px;}
  .dot{width:11px;height:11px;border-radius:2px;background:#B0B6BE;border:1px solid #1A1C22;}
  /* PT menu */
  .menu{
    background:#E6E9ED;border-bottom:1px solid #9AA4B0;
    padding:3px 10px;font-size:11px;color:#222;
    display:flex;gap:14px;
  }
  .menu span:hover{background:#C8D1DB;padding:1px 3px;cursor:default;}
  /* PT toolbar row */
  .ptbar{
    background:#D5DAE0;border-bottom:1px solid #9AA4B0;
    padding:2px 8px;font-size:10px;color:#555;
    display:flex;gap:8px;align-items:center;height:22px;
  }
  .ptbar .btn{background:#F0F2F5;border:1px solid #B0B6BE;padding:1px 5px;border-radius:2px;color:#333;}
  /* Workspace */
  .workspace{
    position:relative;
    background:#FFFFFF;
    background-image:
      radial-gradient(circle, #E4E4DC 1px, transparent 1px);
    background-size:18px 18px;
  }
  svg{display:block;width:100%;height:auto}
  .dev-label{font: 600 11px 'Segoe UI', sans-serif; fill:#1A1A1A; text-anchor:middle;}
  /* PT status bar */
  .statusbar{
    background:#E6E9ED;border-top:1px solid #9AA4B0;
    padding:3px 10px;font-size:10.5px;color:#444;
    display:flex;justify-content:space-between;
  }
</style>
</head>
